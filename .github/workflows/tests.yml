name: Testes e base de referência

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependências ensaiadas
        run: python -m pip install -r requirements-dev.txt
      - name: Conferir a base congelada
        run: python tools/verify_baseline.py
      - name: Executar testes
        run: python -m pytest -q -p no:cacheprovider

  publish-baseline:
    name: Publicar a base 1.15.0
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'lutondatomalela/PunchingShearEC2' &&
      github.event.head_commit.message == 'Publicar PunchingShearEC2 1.15.0 como base congelada'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: publish-baseline-1.15.0
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Obter o commit aprovado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Confirmar identidade da versão
        run: |
          python tools/verify_baseline.py
          python -c "from punching.version import VERSION; assert VERSION == '1.15.0'"
      - name: Criar arquivo e publicar sem substituir versões existentes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing_tag="$(git ls-remote --tags origin refs/tags/v1.15.0)"
          if [ -n "$existing_tag" ]; then
            echo "A tag v1.15.0 já existe. A publicação não a modifica."
            exit 1
          fi
          mkdir -p artifacts
          git archive --format=zip --prefix=PunchingShearEC2_v1_15_0/ --output=artifacts/PunchingShearEC2_v1_15_0_source.zip "$GITHUB_SHA"
          (cd artifacts && sha256sum PunchingShearEC2_v1_15_0_source.zip > SHA256SUMS.txt)
          gh release create v1.15.0 artifacts/PunchingShearEC2_v1_15_0_source.zip artifacts/SHA256SUMS.txt --target "$GITHUB_SHA" --title "PunchingShearEC2 1.15.0" --notes-file docs/releases/v1.15.0.md
