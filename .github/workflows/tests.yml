name: Testes e distribuição Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependências ensaiadas
        run: python -m pip install -r requirements-dev.txt
      - name: Conferir a base de referência
        run: python tools/verify_baseline.py
      - name: Executar testes
        run: python -m pytest -q -p no:cacheprovider

  windows:
    name: Executável Windows x64
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: windows-release-candidate
      cancel-in-progress: false
    steps:
      - name: Obter código validado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configurar Python x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          architecture: x64
      - name: Instalar ferramentas de distribuição
        run: python -m pip install -r requirements-build.txt
      - name: Compilar e ensaiar o executável
        run: python tools/build_windows.py
      - name: Publicar release candidate
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'lutondatomalela/PunchingShearEC2' &&
          startsWith(github.event.head_commit.message, 'Publicar RC Windows ')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python tools/publish_rc.py
